<!doctype html>
<!--
  Source of public/og-image.png (the 1200 x 630 link-preview image).
  Regenerate after design changes with a local Chrome, from the repo root:
    chrome --headless=new --hide-scrollbars --window-size=1200,630 \
      --screenshot=public/og-image.png scripts/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2')
          format('woff2');
        font-weight: 200 800;
        font-stretch: 75% 100%;
      }
      @font-face {
        font-family: 'Figtree';
        src: url('../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 300 900;
      }
      @font-face {
        font-family: 'Martian';
        src: url('../node_modules/@fontsource-variable/martian-mono/files/martian-mono-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 800;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          repeating-linear-gradient(0deg, rgb(255 255 255 / 0.02) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(90deg, rgb(255 255 255 / 0.02) 0 1px, transparent 1px 3px),
          radial-gradient(90% 90% at 80% 45%, #1a2440 0%, #0d1322 70%);
        color: #efebe4;
        font-family: 'Figtree', sans-serif;
      }
      .copy {
        position: absolute;
        left: 80px;
        top: 92px;
        display: grid;
        gap: 22px;
      }
      .eyebrow {
        font:
          500 20px 'Martian',
          monospace;
        letter-spacing: 0.1em;
        color: #ff5c8a;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font:
          750 132px/0.9 'Bricolage',
          sans-serif;
        font-stretch: 82%;
        letter-spacing: -0.02em;
      }
      h1 span {
        color: #ff5c8a;
      }
      .lede {
        font:
          450 36px/1.2 'Bricolage',
          sans-serif;
        max-width: 18ch;
      }
      .url {
        position: absolute;
        left: 80px;
        bottom: 56px;
        font:
          500 20px 'Martian',
          monospace;
        letter-spacing: 0.06em;
        color: #a3acc4;
      }
      svg {
        position: absolute;
        right: 70px;
        top: 95px;
        width: 440px;
        height: 440px;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="eyebrow">Software engineer · Creative · Business owner</div>
      <h1>Clérise<br />Swart<span>.</span></h1>
      <div class="lede">I build the systems behind the work.</div>
    </div>
    <div class="url">builtbyclerise.co.za</div>
    <svg viewBox="-2.4 -2.4 4.8 4.8" id="hoop">
      <circle r="2.17" fill="#151d31" stroke="#d8cfc0" stroke-width="0.09" />
      <circle r="2.02" fill="none" stroke="#d8cfc0" stroke-width="0.05" />
      <circle
        r="1.78"
        fill="none"
        stroke="#a3acc4"
        stroke-width="0.035"
        stroke-dasharray="0.11 0.075"
      />
    </svg>
    <script>
      // The same satin "C" as src/utils/satin.ts (151 needle points, radius 1.15, width 0.42).
      const n = 151
      const pts = []
      for (let i = 0; i < n; i++) {
        const t = i / (n - 1)
        const a = Math.PI / 4 + t * Math.PI * 1.5
        const w = 0.42 * (0.28 + 0.72 * Math.sqrt(Math.sin(Math.PI * t)))
        const r = i % 2 ? 1.15 + w / 2 : 1.15 - w / 2
        pts.push(`${Math.cos(a) * r},${-Math.sin(a) * r}`)
      }
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline')
      line.setAttribute('points', pts.join(' '))
      line.setAttribute('fill', 'none')
      line.setAttribute('stroke', '#ff5c8a')
      line.setAttribute('stroke-width', '0.05')
      document.getElementById('hoop').append(line)
    </script>
  </body>
</html>
